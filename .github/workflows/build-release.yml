          with:
              name: sdrpp_ubuntu_noble_amd64
              path: ${{runner.workspace}}/sdrpp_ubuntu_noble_amd64.deb

    build_ubuntu_noble_aarch64:
        runs-on: ubuntu-24.04-arm
        steps:
        - uses: actions/checkout@v5
        - name: Create Docker Image
          run: cd $GITHUB_WORKSPACE/docker_builds/ubuntu_noble && docker build . --tag sdrpp_build
        - name: Run Container
          run: docker run --cpus=2 --name build -v $GITHUB_WORKSPACE:/root/SDRPlusPlus --env BUILD_NO="-$GITHUB_RUN_NUMBER" sdrpp_build /root/do_build.sh
        - name: Recover Deb Archive
          working-directory: ${{runner.workspace}}
          run: docker cp build:/root/SDRPlusPlus/sdrpp_debian_amd64.deb ./
        - name: Save Deb Archive
          uses: actions/upload-artifact@v6
          with:
              name: sdrpp_ubuntu_noble_aarch64
              path: ${{runner.workspace}}/sdrpp_debian_amd64.deb

    build_ubuntu_resolute_amd64:
        runs-on: ubuntu-24.04
        steps:
        - uses: actions/checkout@v5
        - name: Create Docker Image
          run: cd $GITHUB_WORKSPACE/docker_builds/ubuntu_resolute && docker build . --tag sdrpp_build
        - name: Run Container
          run: docker run --cpus=2 --name build -v $GITHUB_WORKSPACE:/root/SDRPlusPlus --env BUILD_NO="-$GITHUB_RUN_NUMBER" sdrpp_build /root/do_build.sh
        - name: Recover Deb Archive
          working-directory: ${{runner.workspace}}
          run: docker cp build:/root/SDRPlusPlus/sdrpp_debian_amd64.deb ./
        - name: Save Deb Archive
          uses: actions/upload-artifact@v6
          with:
              name: sdrpp_ubuntu_resolute_amd64
              path: ${{runner.workspace}}/sdrpp_debian_amd64.deb

    build_ubuntu_resolute_aarch64:
        runs-on: ubuntu-24.04-arm
        steps:
        - uses: actions/checkout@v5
        - name: Create Docker Image
          run: cd $GITHUB_WORKSPACE/docker_builds/ubuntu_resolute && docker build . --tag sdrpp_build
        - name: Run Container
          run: docker run --cpus=2 --name build -v $GITHUB_WORKSPACE:/root/SDRPlusPlus --env BUILD_NO="-$GITHUB_RUN_NUMBER" sdrpp_build /root/do_build.sh
        - name: Recover Deb Archive
          working-directory: ${{runner.workspace}}
          run: docker cp build:/root/SDRPlusPlus/sdrpp_debian_amd64.deb ./
        - name: Save Deb Archive
          uses: actions/upload-artifact@v6
          with:
              name: sdrpp_ubuntu_resolute_aarch64
              path: ${{runner.workspace}}/sdrpp_debian_amd64.deb

    build_android:
        runs-on: ubuntu-24.04

        steps:
        - uses: actions/checkout@v5

        - name: Fetch container source
          working-directory: ${{runner.workspace}}
          run: git clone https://github.com/AlexandreRouma/android-sdr-kit

        - name: Cache Docker Image
          id: cache-docker
          uses: actions/cache@v5
          with:
            path: ${{runner.workspace}}/android-sdr-kit.tar
            key: docker-android-sdr-kit-v1-${{ hashFiles('**/android-sdr-kit/Dockerfile') }}

        - name: Load Docker Image from Cache
          if: steps.cache-docker.outputs.cache-hit == 'true'
          run: docker load -i ${{runner.workspace}}/android-sdr-kit.tar

        - name: Build Docker Image
          if: steps.cache-docker.outputs.cache-hit != 'true'
          working-directory: ${{runner.workspace}}/android-sdr-kit
          run: |
            docker build --progress=plain -t android-sdr-kit .
            docker save android-sdr-kit -o ${{runner.workspace}}/android-sdr-kit.tar

        - name: Cache Gradle
          uses: actions/cache@v5
          with:
            path: ${{runner.workspace}}/.gradle
            key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
            restore-keys: |
              gradle-${{ runner.os }}-

        - name: Build
          run: |
            mkdir -p ${{runner.workspace}}/.gradle
            docker run --cpus=2 --name build \
              -v $GITHUB_WORKSPACE:/root/SDRPlusPlus \
              -v ${{runner.workspace}}/.gradle:/root/.gradle \
              android-sdr-kit /bin/bash -l -c "cd /root/SDRPlusPlus/android && gradle --info assembleDebug"

        - name: Recover APK
          working-directory: ${{runner.workspace}}
          run: docker cp build:/root/SDRPlusPlus/android/app/build/outputs/apk/debug/app-debug.apk ./ && mv app-debug.apk sdrpp.apk

        - name: Save APK
          uses: actions/upload-artifact@v6
          with:
              name: sdrpp_android
              path: ${{runner.workspace}}/sdrpp.apk

    create_full_archive:
        needs: [
          'build_windows',
          'build_macos_arm',
          'build_debian_bullseye_amd64',
          'build_debian_bullseye_aarch64',
          'build_debian_bookworm_amd64',
          'build_debian_bookworm_aarch64',
          'build_debian_trixie_amd64',
          'build_debian_trixie_aarch64',
          'build_debian_sid_amd64',
          'build_debian_sid_aarch64',
          'build_ubuntu_focal_amd64',
          'build_ubuntu_focal_aarch64',
          'build_ubuntu_jammy_amd64',
          'build_ubuntu_jammy_aarch64',
          'build_ubuntu_noble_amd64',
          'build_ubuntu_noble_aarch64',
          'build_ubuntu_resolute_amd64',
          'build_ubuntu_resolute_aarch64',
          'build_android'
        ]
        if: always()
        runs-on: ubuntu-24.04
        outputs:
            has_files: ${{ steps.collect.outputs.has_files }}

        steps:
        - name: Download All Builds
          uses: actions/download-artifact@v7

        - name: List downloaded
          run: ls -lR . | head -200

        - name: Collect artifacts
          id: collect
          run: |
            mkdir -p sdrpp_all
            copy() {
              src="$1"; dst="$2"
              if [ -f "$src" ]; then
                cp -f "$src" "sdrpp_all/$dst"
                echo "OK   $src -> $dst"
              else
                echo "MISS $src"
              fi
            }
            copy sdrpp_windows_x64/sdrpp_windows_x64.zip            sdrpp_windows_x64.zip
            copy sdrpp_macos_arm/sdrpp_macos_arm.zip                sdrpp_macos_arm.zip
            copy sdrpp_debian_bullseye_amd64/sdrpp_debian_amd64.deb sdrpp_debian_bullseye_amd64.deb
            copy sdrpp_debian_bullseye_aarch64/sdrpp_debian_amd64.deb sdrpp_debian_bullseye_aarch64.deb
            copy sdrpp_debian_bookworm_amd64/sdrpp_debian_amd64.deb sdrpp_debian_bookworm_amd64.deb
            copy sdrpp_debian_bookworm_aarch64/sdrpp_debian_amd64.deb sdrpp_debian_bookworm_aarch64.deb
            copy sdrpp_debian_trixie_amd64/sdrpp_debian_amd64.deb   sdrpp_debian_trixie_amd64.deb
            copy sdrpp_debian_trixie_aarch64/sdrpp_debian_amd64.deb sdrpp_debian_trixie_aarch64.deb
            copy sdrpp_debian_sid_amd64/sdrpp_debian_amd64.deb      sdrpp_debian_sid_amd64.deb
            copy sdrpp_debian_sid_aarch64/sdrpp_debian_amd64.deb    sdrpp_debian_sid_aarch64.deb
            copy sdrpp_ubuntu_focal_amd64/sdrpp_debian_amd64.deb    sdrpp_ubuntu_focal_amd64.deb
            copy sdrpp_ubuntu_focal_aarch64/sdrpp_debian_amd64.deb  sdrpp_ubuntu_focal_aarch64.deb
            copy sdrpp_ubuntu_jammy_amd64/sdrpp_debian_amd64.deb    sdrpp_ubuntu_jammy_amd64.deb
            copy sdrpp_ubuntu_jammy_aarch64/sdrpp_debian_amd64.deb  sdrpp_ubuntu_jammy_aarch64.deb
            copy sdrpp_ubuntu_noble_amd64/sdrpp_ubuntu_noble_amd64.deb sdrpp_ubuntu_noble_amd64.deb
            copy sdrpp_ubuntu_noble_aarch64/sdrpp_debian_amd64.deb  sdrpp_ubuntu_noble_aarch64.deb
            copy sdrpp_ubuntu_resolute_amd64/sdrpp_debian_amd64.deb sdrpp_ubuntu_resolute_amd64.deb
            copy sdrpp_ubuntu_resolute_aarch64/sdrpp_debian_amd64.deb sdrpp_ubuntu_resolute_aarch64.deb
            copy sdrpp_android/sdrpp.apk                            sdrpp.apk

            count=$(ls -1 sdrpp_all/ | wc -l)
            echo "Collected $count files"
            if [ "$count" -gt 0 ]; then
              echo "has_files=true"  >> $GITHUB_OUTPUT
            else
              echo "has_files=false" >> $GITHUB_OUTPUT
            fi

        - uses: actions/upload-artifact@v6
          if: steps.collect.outputs.has_files == 'true'
          with:
            name: sdrpp_all
            path: sdrpp_all/

    release:
        name: Publish release
        needs: [create_full_archive]
        runs-on: ubuntu-24.04
        permissions:
          contents: write
        if: |
            always() &&
            needs.create_full_archive.result == 'success' &&
            needs.create_full_archive.outputs.has_files == 'true' &&
            (
                startsWith(github.ref, 'refs/tags/v') ||
                (github.event_name == 'workflow_dispatch' && inputs.publish)
            )

        steps:
        - uses: actions/checkout@v5

        - name: Read version info
          id: ver
          run: |
            VERSION=$(tr -d '[:space:]' < version.txt)
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
            echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "Release tag: $VERSION ($SHORT_SHA)"

        - name: Download all artifacts
          uses: actions/download-artifact@v7
          with:
              name: sdrpp_all
              path: artifacts

        - name: List artifacts
          run: ls -l artifacts

        - name: Upload assets to release
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            TAG_NAME="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.version }}"
            
            if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
              echo "Release $TAG_NAME does not exist. Creating it..."
              gh release create "$TAG_NAME" --title "SDR++ 简体中文版 $TAG_NAME" --notes "## SDR++ 简体中文版 $TAG_NAME
            
            ### 更新内容
            - 同步上游 SDR++ 最新代码
            - 中文界面修复与优化
            - 完整提交记录请查看仓库 commit 历史
            
            ### 下载说明
            
            | 平台 | 文件 |
            |---|---|
            | Windows x64 | \`sdrpp_windows_x64.zip\` |
            | macOS ARM (Apple Silicon) | \`sdrpp_macos_arm.zip\` |
            | Debian bullseye | \`sdrpp_debian_bullseye_amd64.deb\` / \`sdrpp_debian_bullseye_aarch64.deb\` |
            | Debian bookworm | \`sdrpp_debian_bookworm_amd64.deb\` / \`sdrpp_debian_bookworm_aarch64.deb\` |
            | Debian trixie | \`sdrpp_debian_trixie_amd64.deb\` / \`sdrpp_debian_trixie_aarch64.deb\` |
            | Debian sid | \`sdrpp_debian_sid_amd64.deb\` / \`sdrpp_debian_sid_aarch64.deb\` |
            | Ubuntu focal (20.04) | \`sdrpp_ubuntu_focal_amd64.deb\` / \`sdrpp_ubuntu_focal_aarch64.deb\` |
            | Ubuntu jammy (22.04) | \`sdrpp_ubuntu_jammy_amd64.deb\` / \`sdrpp_ubuntu_jammy_aarch64.deb\` |
            | Ubuntu noble (24.04) | \`sdrpp_ubuntu_noble_amd64.deb\` / \`sdrpp_ubuntu_noble_aarch64.deb\` |
            | Ubuntu resolute | \`sdrpp_ubuntu_resolute_amd64.deb\` / \`sdrpp_ubuntu_resolute_aarch64.deb\` |
            | Android | \`sdrpp.apk\` |
            
            ### 安装说明
            - Windows: 解压后运行 \`sdrpp.exe\`
            - macOS: 解压后拖入 Applications
            - Linux: \`sudo dpkg -i <包名>.deb\`，如缺依赖执行 \`sudo apt install -f\`
            - Android: 直接安装 APK，需允许未知来源"
            fi
            
            echo "Uploading assets to $TAG_NAME..."
            gh release upload "$TAG_NAME" artifacts/* --clobber

    check_spelling:
        runs-on: ubuntu-24.04

        steps:
        - uses: actions/checkout@v5

        - name: Install codespell
          run: sudo apt update -y && sudo apt install -y codespell

        - name: Running codespell
          run: cd $GITHUB_WORKSPACE && codespell -q 2 || true

    check_formatting:
        runs-on: ubuntu-24.04

        steps:
        - uses: actions/checkout@v5

        - name: Run check_clang_format
          run: cd $GITHUB_WORKSPACE && chmod +x ./check_clang_format.sh && ./check_clang_format.sh || true
